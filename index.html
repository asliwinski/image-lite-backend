<body>
    <div class="container">
        <h1>Image Lite Backend</h1>
        <p>Image-compression proxy for the Image Lite browser extension.</p>
        <p>Requests look like:</p>
        <pre><code>/api/index?w=1920&amp;q=40&amp;bw=0&amp;f=webp&amp;url=&lt;image URL&gt;</code></pre>
        <p>For the source code and details, visit the
            <a href="https://github.com/asliwinski/image-lite-backend">GitHub repository</a>.</p>
    </div>
</body>
